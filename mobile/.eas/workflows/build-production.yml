name: Build de producao (Android + iOS)

# Disparo manual, direto do terminal, dentro de mobile/:
#   eas workflow:run .eas/workflows/build-production.yml
# Builda Android + iOS juntos. O botao do GitHub (Mobile Deploy) usa
# build-production-android.yml (so Android) — ver doc/README-cicd.md.

jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: production
  build_ios:
    type: build
    params:
      platform: ios
      profile: production
