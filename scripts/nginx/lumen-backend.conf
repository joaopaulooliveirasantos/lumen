# Config do Nginx da VPS do Lumen. Enviada por scripts/deploy-vps.sh e scripts/deploy-biblias.sh
# para /etc/nginx/sites-available/lumen-backend (fonte única: editar aqui, não no servidor).
server {
    # HTTP continua ativo: os builds antigos do app usam http://147.15.109.185.
    listen 80 default_server;
    # HTTPS para api.lumenliturgia.com.br. Certificado do Let's Encrypt emitido com
    # `certbot certonly --webroot -w /var/www/letsencrypt -d api.lumenliturgia.com.br`;
    # o certbot.timer renova sozinho e o gancho renewal-hooks/deploy/reload-nginx.sh recarrega o Nginx.
    # Numa VPS nova, emita o certificado antes de enviar esta config (senão o `nginx -t` falha).
    listen 443 ssl http2;
    # O nome explícito é necessário: a VPS hospeda outro site com HTTPS (sites-available/lider) e, sem ele,
    # o Nginx entregaria o certificado do outro site para api.lumenliturgia.com.br.
    server_name _ api.lumenliturgia.com.br;
    ssl_certificate     /etc/letsencrypt/live/api.lumenliturgia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lumenliturgia.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Desafio do Let's Encrypt (certbot --webroot), usado na emissão e nas renovações.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Bíblias estáticas (geradas por scripts/bible/build-bible-assets.mjs).
    # Os arquivos ficam em /var/www/lumen-static/biblias/...; o .json.gz pré-comprimido é servido
    # direto quando o cliente aceita gzip.
    location = /biblias/manifest.json {
        root /var/www/lumen-static;
        gzip_static on;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /biblias/ {
        root /var/www/lumen-static;
        gzip_static on;
        default_type application/json;
        try_files $uri =404;
        # O caminho carrega a versão do conteúdo, então os arquivos nunca mudam.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
