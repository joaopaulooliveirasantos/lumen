# Site de divulgação do Lumen (site/ no repositório). Enviada por scripts/deploy-site.sh para
# /etc/nginx/sites-available/lumen-site. Fonte única: editar aqui, não no servidor.
# Não altera lumen-backend (API) nem lider (outro site da VPS).
#
# Certificado do Let's Encrypt emitido pelo próprio deploy-site.sh com
# `certbot certonly --webroot -w /var/www/letsencrypt -d lumenliturgia.com.br -d www.lumenliturgia.com.br`.
# O desafio HTTP é respondido pelo bloco da porta 80 abaixo (ou, antes desta config existir, pelo
# default_server da API, que serve o mesmo webroot). A renovação usa o certbot.timer e o gancho
# renewal-hooks/deploy/reload-nginx.sh que já existem na VPS.

# HTTP: só o desafio do Let's Encrypt; o resto vai para HTTPS no domínio sem www.
server {
    listen 80;
    server_name lumenliturgia.com.br www.lumenliturgia.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://lumenliturgia.com.br$request_uri;
    }
}

# HTTPS www -> domínio sem www.
server {
    listen 443 ssl http2;
    server_name www.lumenliturgia.com.br;
    ssl_certificate     /etc/letsencrypt/live/lumenliturgia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumenliturgia.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://lumenliturgia.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lumenliturgia.com.br;
    ssl_certificate     /etc/letsencrypt/live/lumenliturgia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumenliturgia.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /var/www/lumen-site/current;
    index index.html;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # URLs limpas: /privacidade -> /privacidade/index.html; /privacidade/ também funciona.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Assets do Vite têm hash no nome: podem ficar em cache para sempre.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Android App Links (fase 4 do planejamento), quando o arquivo existir.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
