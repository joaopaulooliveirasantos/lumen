  <script type="text/JavaScript">
    
    function promptUserToRefresh(reg) {
      // Show update div
      const updateElement = document.querySelector('.update-button-div');
      if (updateElement) {
        updateElement.className = updateElement.className.replace(/\bhide\b/g, "");
      }
      // Click event to reload the page
      const updatebutton = document.querySelector('.update-button');
      if (updatebutton) {
        updatebutton.addEventListener('click', event => {
          if (reg.waiting) {
            reg.waiting.postMessage('skipWaiting');
          }
        });
      }
    }

    // Begining of the code to ask user to update website content.
    function listenForWaitingServiceWorker(reg, callback) {
      function awaitStateChange() {
        reg.installing.addEventListener('statechange', function() {
          if (this.state === 'installed') {
            promptUserToRefresh(reg);
          };
        });
      }
      if (!reg) return;
      if (reg.waiting) return promptUserToRefresh(reg);
      if (reg.installing) awaitStateChange();
      reg.addEventListener('updatefound', awaitStateChange);
    }

    if (navigator.serviceWorker) {
      navigator.serviceWorker.register('/service-worker-custom.js').then((registration) =>{
        registration.onupdatefound = function () {
          promptUserToRefresh(registration)
          
        };
        listenForWaitingServiceWorker(registration);
      })
    }
