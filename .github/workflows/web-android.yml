name: Web Android (Capacitor)

# Compila o novo frontend (lumen/web) em um AAB assinado. O AAB sempre fica como artefato do workflow.
# Com `track` diferente de "nenhuma", também envia à Play Store (exige o segredo PLAY_SERVICE_ACCOUNT_JSON;
# passo a passo em doc/publicacao-play-store.md). Notas da versão: web/android/whatsnew/.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode do AAB (precisa ser maior que o último enviado à Play Store)"
        required: true
        default: "15"
      version_name:
        description: "versionName exibido ao usuário"
        required: true
        default: "1.1.0"
      track:
        description: "Enviar à Play Store? (nenhuma = só gerar o AAB)"
        required: true
        default: "nenhuma"
        type: choice
        options:
          - nenhuma
          - internal
          - production
      rollout:
        description: "Só para production: fração do lançamento em etapas (ex.: 0.1 = 10%)"
        required: false
        default: "0.1"

jobs:
  build-aab:
    name: Build do AAB assinado
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VITE_API_BASE_URL: https://api.lumenliturgia.com.br
      VITE_SUPABASE_URL: https://ccdppkqnduvnfuxgdvry.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_iZU34cOvPxyNTbeCvcf-QQ_eJEpbm4E
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck e testes
        run: |
          npm run typecheck
          npm test

      - name: Build web
        run: npm run build

      - name: Sincronizar projeto Android
        run: npx cap sync android

      - name: Restaurar keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Gerar AAB release
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Mostrar impressao digital do certificado (compare com a chave de upload na Play Console)
        run: keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -E "SHA1|SHA256|Owner"

      - name: Remover keystore do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Publicar AAB como artefato
        uses: actions/upload-artifact@v4
        with:
          name: lumen-web-aab-${{ inputs.version_code }}
          path: web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Enviar à Play Store
        if: ${{ inputs.track != 'nenhuma' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.joaopaulosantos.lumen
          releaseFiles: web/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          # Trilha interna: libera na hora. Produção: lançamento em etapas (inProgress + userFraction).
          status: ${{ inputs.track == 'production' && 'inProgress' || 'completed' }}
          userFraction: ${{ inputs.track == 'production' && inputs.rollout || '' }}
          releaseName: ${{ inputs.version_name }} (${{ inputs.version_code }})
          whatsNewDirectory: web/android/whatsnew
