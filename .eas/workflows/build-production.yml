name: Build de producao (Android + iOS)

# Disparo manual por enquanto: rode com
#   eas workflow:run .eas/workflows/build-production.yml
# do terminal (usa a sessao autenticada do EAS CLI, sem precisar de
# token adicional). Fase 4 do plano de CI/CD — ver doc/README-cicd.md.

jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: production
  build_ios:
    type: build
    params:
      platform: ios
      profile: production
