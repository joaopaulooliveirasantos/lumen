name: Submit Android (Play Store, track interno)

# Disparo manual: eas workflow:run .eas/workflows/submit-android.yml
# Publicacao e irreversivel — nao automatizar via push/PR (ver decisao
# em aberto na secao 11 do plano de CI/CD). Usa o mesmo
# serviceAccountKeyPath ja configurado em mobile/eas.json.

jobs:
  submit_android:
    type: submit
    params:
      platform: android
      profile: production
